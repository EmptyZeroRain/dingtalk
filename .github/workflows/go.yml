name: Go

on:
  push:
    tags:
      - 'v*'
  pull_request:
    branches: [ "main" ]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Set up Go
      uses: actions/setup-go@v4
      with:
        go-version: '1.23'

    - name: Test
      run: go test -v ./...

    - name: Build binaries
      run: |
        GOOS=linux GOARCH=amd64 go build -o dingtalk-linux-amd64 .
        GOOS=linux GOARCH=arm64 go build -o dingtalk-linux-arm64 .
        GOOS=darwin GOARCH=amd64 go build -o dingtalk-darwin-amd64 .
        GOOS=darwin GOARCH=arm64 go build -o dingtalk-darwin-arm64 .
        GOOS=windows GOARCH=amd64 go build -o dingtalk-windows-amd64.exe .

    - name: Create Release
      uses: softprops/action-gh-release@v2
      with:
        files: |
          dingtalk-linux-amd64
          dingtalk-linux-arm64
          dingtalk-darwin-amd64
          dingtalk-darwin-arm64
          dingtalk-windows-amd64.exe
        generate_release_notes: true
